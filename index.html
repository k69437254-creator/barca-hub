<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blaugrana</title>
<style>
body { font-family: sans-serif; background: #070b14; color: white; margin: 0; padding-bottom: 80px; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #0f1626; position: sticky; top: 0; z-index: 10;}
.title { font-size: 20px; font-weight: bold; color: #00d4ff; }
.card { background: #131b2e; padding: 15px; margin: 10px; border-radius: 12px; border: 1px solid #1e2942;}
.nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #0f1626; padding: 10px 0; border-top: 1px solid #1e2942; z-index: 10;}
.nav button { flex: 1; background: none; border: none; color: #8894b8; font-size: 12px; font-weight: bold;}
.nav button.active { color: #00d4ff; }
.crest { display: inline-flex; justify-content: center; align-items: center; width: 40px; height: 40px; border-radius: 50%; background: #2c3e50; color: white; font-weight: bold; vertical-align: middle; margin-left: 10px;}
.row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e2942; }
.mut { color: #8894b8; font-size: 12px;}
h2 { margin-right: 10px; font-size: 18px;}
</style>
</head>
<body>

<div class="header">
    <div class="title">Blaugrana</div>
    <div style="display:flex;gap:10px;">
        <button onclick="alert( الإعدادات قريباً )" style="background:none;border:none;color:white;font-size:20px;">⚙️</button>
    </div>
</div>

<div id="content" style="padding: 10px;">
    <!-- سيتم تحميل المحتوى هنا -->
</div>

<div class="nav" id="nav">
    <button class="active" onclick="showPage( home )">🏠<br>الرئيسية</button>
    <button onclick="showPage( matches )">⚽<br>المباريات</button>
    <button onclick="showPage( standings )">📊<br>الترتيب</button>
    <button onclick="showPage( squad )">👥<br>الفريق</button>
    <button onclick="showPage( more )">☰<br>المزيد</button>
</div>

<script>
// البيانات
var MATCHES = [
    { comp:  الدوري الإسباني , home: false, opp:  إشبيلية , score: [3, 1], date:  أمس  },
    { comp:  الدوري الإسباني , home: true, opp:  خيتافي , score: [3, 0], date:  قبل يومين  },
    { comp:  دوري أبطال أوروبا , home: false, opp:  باريس سان جيرمان , date:  غداً , probs: [39, 22, 39] },
    { comp:  الدوري الإسباني , home: true, opp:  ريال مدريد , date:  بعد 4 أيام  }
];

var STANDINGS = [
    [ برشلونة , 8, 0, 0, 24],
    [ أتلتيكو مدريد , 6, 1, 1, 19],
    [ ريال بيتيس , 6, 1, 1, 19],
    [ ريال مدريد , 6, 0, 2, 18],
    [ إشبيلية , 4, 2, 2, 14]
];

var SQUAD = [
    [1,  جوان غارسيا ,  حارس مرمى ],
    [2,  كانسيلو ,  مدافع ],
    [3,  بالدي ,  مدافع ],
    [8,  بيدري ,  وسط ],
    [16,  رودري ,  وسط ],
    [10,  لامين يامال ,  مهاجم ],
    [9,  غابرييل جيسوس ,  مهاجم ]
];

// دالة إنشاء الشعار
function crest(team) {
    if(team ===  برشلونة ) return  <div class="crest" style="background:linear-gradient(90deg,#004d98 50%,#a50044 50%);border:2px solid #f5c418">FCB</div> ;
    return  <div class="crest">  + team.charAt(0) +  </div> ;
}

// دالة التنقل بين الصفحات
function showPage(page) {
    var content = document.getElementById( content );
    content.innerHTML =   ;
    
    // تحديث لون الشريط السفلي
    var buttons = document.getElementById( nav ).getElementsByTagName( button );
    for(var b=0; b<buttons.length; b++) { buttons[b].className =   ; }
    event.currentTarget.className =  active ;

    // الرئيسية
    if(page ===  home ) {
        content.innerHTML +=  <h2>المباراة القادمة</h2> ;
        var m = MATCHES[2];
        content.innerHTML +=  <div class="card" style="text-align:center; background:linear-gradient(135deg,#0a2463,#4a0d3a)">  +
             <p class="mut">  + m.comp +  </p>  +
             <h1>  + m.opp +   ضد برشلونة</h1>  +
             <p>  + m.date +  </p>  +
             <p style="font-size:12px">نسبة الفوز:   + m.probs[0] +  %</p>  +
             </div> ;

        content.innerHTML +=  <h2>آخر النتائج</h2> ;
        for(var i=0; i<2; i++) {
            var r = MATCHES[i];
            content.innerHTML +=  <div class="card row"><b>  + (r.home? برشلونة :r.opp) +     + r.score[0] +   -   + r.score[1] +     + (r.home?r.opp: برشلونة ) +  </b></div> ;
        }
    }
    // المباريات
    else if(page ===  matches ) {
        content.innerHTML +=  <h2>المباريات</h2> ;
        for(var i=0; i<MATCHES.length; i++) {
            var m = MATCHES[i];
            content.innerHTML +=  <div class="card"><b>  + (m.home? برشلونة :m.opp) +   ضد   + (m.home?m.opp: برشلونة ) +  </b><br><small class="mut">  + m.date +  </small></div> ;
        }
    }
    // الترتيب
    else if(page ===  standings ) {
        content.innerHTML +=  <h2>ترتيب الليغا</h2> ;
        for(var i=0; i<STANDINGS.length; i++) {
            var t = STANDINGS[i];
            var isBarca = t[0] ===  برشلونة  ?  style="background:#1e2942"  :   ;
            content.innerHTML +=  <div class="card row"   + isBarca +  ><span><b>  + (i+1) +  .   + t[0] +  </b></span><span>  + t[4] +   نقطة</span></div> ;
        }
    }
    // الفريق
    else if(page ===  squad ) {
        content.innerHTML +=  <h2>الفريق</h2> ;
        for(var i=0; i<SQUAD.length; i++) {
            var p = SQUAD[i];
            content.innerHTML +=  <div class="card row"><span><b>  + p[1] +  </b></span><span class="mut">  + p[2] +  </span></div> ;
        }
    }
    // المزيد
    else if(page ===  more ) {
        content.innerHTML +=  <h2>المزيد</h2><div class="card">هذه النسخة التجريبية الأولى، سيتم إضافة المزيد قريباً.</div> ;
    }
}

// تشغيل الصفحة الرئيسية عند الفتح
showPage( home );
</script>
</body>
</html>
