<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Blaugrana</title>
<style>
:root{
  --bg:#070b14;--bg2:#0f1626;--card:#131b2e;--card2:#1a2340;
  --ink:#eef2ff;--mut:#8894b8;--line:#1e2942;
  --acc:#00d4ff;--acc2:#7c3aed;--blue:#004d98;--red:#a50044;--gold:#f5c418;
  --ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;
  --r:18px;--rl:24px;--sh:0 8px 32px rgba(0,0,0,.35);
  --ff: Readex Pro , Segoe UI ,Tahoma,sans-serif;
}
@media(prefers-color-scheme:light){
  :root{--bg:#f5f7fc;--bg2:#fff;--card:#fff;--card2:#f0f3fa;--ink:#0a1224;--mut:#5a6480;--line:#e2e8f4;--sh:0 4px 20px rgba(20,30,70,.08)}
}
html[data-th="light"]{--bg:#f5f7fc;--bg2:#fff;--card:#fff;--card2:#f0f3fa;--ink:#0a1224;--mut:#5a6480;--line:#e2e8f4;--sh:0 4px 20px rgba(20,30,70,.08)}
html[data-th="dark"]{--bg:#070b14;--bg2:#0f1626;--card:#131b2e;--card2:#1a2340;--ink:#eef2ff;--mut:#8894b8;--line:#1e2942;--sh:0 8px 32px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1000px 500px at 90% -10%,rgba(0,77,152,.15),transparent 60%),radial-gradient(800px 400px at -10% 10%,rgba(165,0,68,.12),transparent 60%),var(--bg);color:var(--ink);font-family:var(--ff);line-height:1.6;min-height:100vh}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--acc);text-decoration:none}
h1,h2,h3{font-weight:700;margin:0 0 8px;line-height:1.25}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
.mut{color:var(--mut);font-size:13px}
.sm{font-size:12px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* ===== Header ===== */
.top{position:sticky;top:0;z-index:50;background:rgba(7,11,20,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
html[data-th="light"] .top{background:rgba(245,247,252,.85)}
.top-in{max-width:640px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;flex:none}
.brand-t{flex:1;min-width:0}
.brand-t b{display:block;font-size:18px;font-weight:800;background:linear-gradient(135deg,#004d98,#a50044);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-t small{display:block;font-size:11px;color:var(--mut)}
.ib{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.ib:active{transform:scale(.92)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}

/* ===== Main ===== */
main{max-width:640px;margin:0 auto;padding:14px 0 120px}
.sc{display:none;padding:0 14px}
.sc.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== Cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card.flat{box-shadow:none;background:var(--card2)}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ch h2{margin:0;font-size:15px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.ch a{font-size:13px;font-weight:600}

/* ===== Hero Match ===== */
.hero{position:relative;border-radius:var(--rl);padding:22px 18px;background:linear-gradient(135deg,#0a2463 0%,#4a0d3a 100%);color:#fff;overflow:hidden;margin-bottom:14px;box-shadow:0 16px 48px rgba(10,20,60,.45)}
.hero:before{content:"";position:absolute;top:-40%;right:-20%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%)}
.hero>*{position:relative}
.hero-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.15);margin-bottom:14px}
.hero-teams{display:flex;align-items:center;justify-content:space-around;margin:16px 0}
.hero-team{flex:1;text-align:center}
.hero-team img,.hero-team .crest-fb{width:66px;height:66px;margin:0 auto 8px;border-radius:50%;background:#fff;padding:6px;object-fit:contain;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.hero-team b{display:block;font-size:14px;font-weight:700}
.hero-vs{font-size:22px;font-weight:800;opacity:.6;padding:0 8px}
.hero-countdown{display:flex;justify-content:center;gap:8px;margin-top:12px;direction:ltr}
.hero-countdown>div{background:rgba(0,0,0,.25);border-radius:10px;padding:8px 10px;text-align:center;min-width:56px}
.hero-countdown b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.hero-countdown small{font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.hero-prob{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.15);margin:14px 0 8px}
.hero-prob i{display:block}
.hero-prob-labels{display:flex;justify-content:space-between;font-size:11px;opacity:.9}

/* ===== Match Row ===== */
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:background .15s}
.mrow:active{background:var(--card2)}
.mrow-t{min-width:56px;text-align:center;font-size:11px;color:var(--mut)}
.mrow-t b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.mrow-t .ft{color:var(--ok);font-weight:700}
.mrow-teams{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.mrow-team{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.mrow-team img,.mrow-team .crest-fb{width:24px;height:24px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;flex:none}
.mrow-sc{min-width:44px;text-align:center;font-size:15px;font-weight:800;color:var(--ink);direction:ltr;display:flex;flex-direction:column;gap:4px}
.mrow-sc .winner{color:var(--ok)}
.mrow-sc .loser{color:var(--mut)}

/* ===== Standings Table ===== */
.standings{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stand-row{display:grid;grid-template-columns:32px 1fr 36px 30px 30px 30px 44px;gap:6px;padding:11px 12px;align-items:center;font-size:13px;border-bottom:1px solid var(--line);position:relative;font-variant-numeric:tabular-nums}
.stand-row:last-child{border-bottom:0}
.stand-row.hd{background:var(--card2);font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;padding:8px 12px}
.stand-row.me{background:linear-gradient(90deg,rgba(0,77,152,.15),transparent)}
.stand-row.me::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:linear-gradient(180deg,#004d98,#a50044)}
.stand-team{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.stand-team img,.stand-team .crest-fb{width:22px;height:22px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;flex:none}
.stand-team span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start}
.stand-pts{font-weight:800;color:var(--ink);text-align:center;font-size:14px}
.stand-num{text-align:center;color:var(--mut);font-size:12px}
.stand-rk{font-weight:700;color:var(--mut);text-align:center;font-size:12px}
.zone{position:absolute;inset-block:8px;inset-inline-start:0;width:3px;border-radius:2px}
.zone-ucl{background:var(--ok)}.zone-uel{background:var(--acc)}.zone-conf{background:var(--warn)}.zone-rel{background:var(--danger)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;font-size:14px;transition:transform .12s,opacity .12s;width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:13px;width:auto}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:20px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;transition:all .15s;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:active{transform:scale(.96)}

/* ===== Forms ===== */
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--mut)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{min-height:100px;resize:vertical}
select option{background:var(--card);color:var(--ink)}

/* ===== Squad Grid ===== */
.squad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;cursor:pointer;transition:transform .15s;position:relative}
.pcard:active{transform:scale(.97)}
.pcard .avatar{width:80px;height:80px;margin:0 auto 8px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#004d98,#a50044);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.pcard .avatar svg,.pcard .avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .num{position:absolute;top:8px;left:10px;font-size:20px;font-weight:900;color:var(--gold);opacity:.9}
.pcard .name{font-size:13px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pos{font-size:11px;color:var(--mut)}

/* ===== Sheet / Modal ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:8px 0 calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-grip{width:44px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.sheet-in{padding:0 18px}
.sheet h2{margin-bottom:12px}

/* ===== Bottom Nav ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(7,11,20,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
html[data-th="light"] .nav{background:rgba(245,247,252,.92)}
.nav-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-around;padding:0 8px}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;color:var(--mut);font-size:10.5px;font-weight:600;transition:color .15s;position:relative}
.nav-btn.on{color:var(--acc)}
.nav-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.nav-btn.on svg{stroke-width:2.4}
.nav-btn:active{transform:scale(.92)}
.badge{position:absolute;top:2px;right:calc(50% - 16px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center}
.badge.on{display:flex}

/* ===== Avatar SVG ===== */
.avatar-svg{width:100%;height:100%;display:block}

/* ===== Toast ===== */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:1px solid var(--line);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ===== Misc ===== */
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty svg{width:56px;height:56px;margin:0 auto 10px;opacity:.4}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);padding:14px 8px;border-radius:14px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut)}
.win-badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;color:#fff;margin:0 1px}
.wb-W{background:var(--ok)}.wb-D{background:var(--warn)}.wb-L{background:var(--danger)}
.divider{height:1px;background:var(--line);margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row b{font-weight:600}
.row .val{color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1 0 auto;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap;transition:all .15s}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* ===== Loading / Skeleton ===== */
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--card2),var(--line),var(--card2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* ===== Hero2 mini ===== */
.mini-hero{background:linear-gradient(135deg,#004d98,#a50044);border-radius:var(--r);padding:16px;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.mini-hero .mt{flex:1}
.mini-hero b{display:block;font-size:15px}
.mini-hero small{font-size:12px;opacity:.85}

/* ===== Player Detail ===== */
.pd-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.pd-av{width:100px;height:100px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#004d98,#a50044);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pd-info b{display:block;font-size:22px;font-weight:800}
.pd-info .mut{margin-top:4px}

/* ===== Chat ===== */
.chat-box{height:360px;overflow-y:auto;background:var(--card2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.msg{padding:8px 14px;border-radius:16px;max-width:82%;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg.me{align-self:flex-start;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.msg.other{align-self:flex-end;background:var(--card);border:1px solid var(--line)}
.msg .nm{font-size:10px;opacity:.7;margin-bottom:3px;font-weight:700}
.msg .tm{font-size:9px;opacity:.6;margin-top:3px;display:block}

/* ===== Fireworks/notice ===== */
.notice{padding:14px;border-radius:14px;font-size:13px;line-height:1.7;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.notice.info{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);color:var(--ink)}
.notice.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--ink)}
.notice.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--ink)}
.notice b{color:var(--acc)}

/* ===== Predictions ===== */
.pred-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.pred-row:last-child{border-bottom:0}
.pred-row .pin{width:44px;text-align:center;font-weight:700}
.pred-row .pin input{padding:8px;text-align:center;font-weight:700;font-size:16px}
.pred-row .team{flex:1}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div id="brandLogo" class="logo"></div>
    <div class="brand-t"><b>Blaugrana</b><small>لوحة مشجع برشلونة</small></div>
    <button class="ib" id="themeBtn" aria-label="الثيم">
      <svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
    <button class="ib" id="settingsBtn" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.4 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.4-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="sc on" id="home"></section>
  <section class="sc" id="matches"></section>
  <section class="sc" id="standings"></section>
  <section class="sc" id="squad"></section>
  <section class="sc" id="more"></section>
  <section class="sc" id="predictions"></section>
  <section class="sc" id="chat"></section>
  <section class="sc" id="profile"></section>
  <section class="sc" id="settings"></section>
  <section class="sc" id="news"></section>
</main>

<nav class="nav">
  <div class="nav-in" id="navIn"></div>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"><div class="sheet-grip"></div><div class="sheet-in" id="sheetIn"></div></div></div>

<script>
(function(){
 use strict ;

/* ============ Utilities ============ */
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const ls = { get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }, del: k => { try { localStorage.removeItem(k); } catch {} } };

/* ============ Data ============ */
// Club logos - real crests from Wikimedia
const LOGOS = {
   برشلونة :  https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg ,
   ريال مدريد :  https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg ,
   أتلتيكو مدريد :  https://upload.wikimedia.org/wikipedia/en/f/f4/Atletico_Madrid_2017_logo.svg ,
   إشبيلية :  https://upload.wikimedia.org/wikipedia/en/3/3b/Sevilla_FC_logo.svg ,
   ريال بيتيس :  https://upload.wikimedia.org/wikipedia/en/1/13/Real_betis_logo.svg ,
   فالنسيا :  https://upload.wikimedia.org/wikipedia/en/c/ce/Valenciacf.svg ,
   فياريال :  https://upload.wikimedia.org/wikipedia/en/7/70/Villarreal_CF_logo-en.svg ,
   ريال سوسيداد :  https://upload.wikimedia.org/wikipedia/en/f/f7/Real_Sociedad_logo.svg ,
   أتلتيك بلباو :  https://upload.wikimedia.org/wikipedia/en/9/98/Club_Athletic_Bilbao_logo.svg ,
   أوساسونا :  https://upload.wikimedia.org/wikipedia/en/1/13/CA_Osasuna_logo.svg ,
   سيلتا فيغو :  https://upload.wikimedia.org/wikipedia/en/7/7c/RC_Celta_de_Vigo_logo.svg ,
   خيتافي :  https://upload.wikimedia.org/wikipedia/en/0/0e/Getafe_CF_logo.svg ,
   رايو فايكانو :  https://upload.wikimedia.org/wikipedia/en/c/c3/Rayo_Vallecano_logo.svg ,
   إسبانيول :  https://upload.wikimedia.org/wikipedia/en/8/8a/RCD_Espanyol_logo.svg ,

}

function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) + Math.round(2.55 * percent);
  let g = ((num >> 8) & 0xff) + Math.round(2.55 * percent);
  let b = (num & 0xff) + Math.round(2.55 * percent);
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return  #  + ((r << 16) | (g << 8) | b).toString(16).padStart(6,  0 );
}

function startCountdown(iso) {
  clearInterval(window.__cdTimer);
  const target = new Date(iso).getTime();
  const wrap = document.querySelector( [data-cd] );
  if (!wrap) return;
  const dEl = wrap.querySelector( [data-d] );
  const hEl = wrap.querySelector( [data-h] );
  const mEl = wrap.querySelector( [data-m] );
  const sEl = wrap.querySelector( [data-s] );
  const tick = () => {
    const diff = target - Date.now();
    if (diff <= 0) { dEl.textContent =  00 ; hEl.textContent =  00 ; mEl.textContent =  00 ; sEl.textContent =  00 ; return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    dEl.textContent = String(d).padStart(2,  0 );
    hEl.textContent = String(h).padStart(2,  0 );
    mEl.textContent = String(m).padStart(2,  0 );
    sEl.textContent = String(s).padStart(2,  0 );
  };
  tick();
  window.__cdTimer = setInterval(tick, 1000);
}

function estimateProbs(m) {
  const barcaPpg = STANDINGS[0][4] / 8;
  const oppRow = STANDINGS.find(t => t[0] === m.opp);
  const oppPpg = oppRow ? oppRow[4] / (oppRow[1] + oppRow[2] + oppRow[3]) : 1.6;
  const diff = barcaPpg - oppPpg;
  const homeAdv = m.home ? 0.15 : -0.15;
  const pWin = Math.max(30, Math.min(75, 50 + diff * 25 + homeAdv * 40));
  const pDraw = 20 + Math.random() * 5;
  const pLoss = 100 - pWin - pDraw;
  return [Math.round(pWin), Math.round(pDraw), Math.round(pLoss)];
}

/* ============ AI Integration ============ */
async function callAI(prompt) {
  const { endpoint, apiKey, model } = state.aiConfig;
  if (!endpoint || !apiKey) {
    throw new Error( لم يتم إعداد الذكاء الاصطناعي. اذهب إلى الإعدادات وأضف مفتاح API. );
  }
  const r = await fetch(endpoint, {
    method:  POST ,
    headers: {
       Content-Type :  application/json ,
       Authorization :  Bearer   + apiKey
    },
    body: JSON.stringify({
      model: model ||  gpt-4o-mini ,
      messages: [{ role:  user , content: prompt }],
      temperature: 0.7,
      max_tokens: 500
    })
  });
  if (!r.ok) {
    const err = await r.text().catch(() =>   );
    throw new Error(`HTTP ${r.status}: ${err.slice(0, 120)}`);
  }
  const data = await r.json();
  return data.choices?.[0]?.message?.content
    || data.content?.[0]?.text
    || data.candidates?.[0]?.content?.parts?.[0]?.text
    ||  لم يتم استلام رد ;
}

/* ============ Helpers ============ */
function escapeHtml(str) {
  if (str == null) return   ;
  return String(str).replace(/[&<>" ]/g, c => ({  & :  &amp; ,  < :  &lt; ,  > :  &gt; ,  " :  &quot; , " ":  &#39;  }[c]));
}

/* ============ Event listeners ============ */
$( themeBtn ).onclick = () => {
  const order = [ dark ,  light ,  auto ];
  const next = order[(order.indexOf(state.theme) + 1) % order.length];
  applyTheme(next);
  if (currentSection ===  settings ) renderSettings();
  toast( الثيم:   + { dark:  ليلي , light:  نهاري , auto:  تلقائي  }[next]);
};
$( settingsBtn ).onclick = () => go( settings );

/* ============ Keyboard ============ */
document.addEventListener( keydown , e => {
  if (e.key ===  Escape ) closeSheet();
});

/* ============ Boot ============ */
go( home );
})();
