<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Blaugrana</title>
<style>
:root{
  --bg:#070b14;--bg2:#0f1626;--card:#131b2e;--card2:#1a2340;
  --ink:#eef2ff;--mut:#8894b8;--line:#1e2942;
  --acc:#00d4ff;--acc2:#7c3aed;--gold:#f5c418;
  --ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;
  --r:18px;--rl:24px;--sh:0 8px 32px rgba(0,0,0,.35);
  --ff:system-ui, -apple-system,  Segoe UI , Tahoma, sans-serif;
}
html[data-th="light"]{--bg:#f5f7fc;--bg2:#fff;--card:#fff;--card2:#f0f3fa;--ink:#0a1224;--mut:#5a6480;--line:#e2e8f4;--sh:0 4px 20px rgba(20,30,70,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);line-height:1.6;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{font-weight:700;margin:0 0 8px;line-height:1.25}
h1{font-size:24px}h2{font-size:18px}
.mut{color:var(--mut);font-size:13px}
.top{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:12px}
.brand-t{flex:1;min-width:0}
.brand-t b{display:block;font-size:18px;font-weight:800;color:var(--acc)}
.brand-t small{display:block;font-size:11px;color:var(--mut)}
.ib{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--ink)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
main{max-width:640px;margin:0 auto;padding:14px 0 120px}
.sc{display:none;padding:0 14px}
.sc.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ch h2{margin:0;font-size:15px;color:var(--mut)}
.hero{position:relative;border-radius:var(--rl);padding:22px 18px;background:linear-gradient(135deg,#0a2463 0%,#4a0d3a 100%);color:#fff;margin-bottom:14px}
.hero-tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.15);margin-bottom:14px}
.hero-teams{display:flex;align-items:center;justify-content:space-around;margin:16px 0}
.hero-team{flex:1;text-align:center}
.hero-team b{display:block;font-size:14px;font-weight:700;margin-top:6px}
.hero-vs{font-size:22px;font-weight:800;opacity:.6}
.hero-countdown{display:flex;justify-content:center;gap:8px;margin-top:12px;direction:ltr}
.hero-countdown>div{background:rgba(0,0,0,.25);border-radius:10px;padding:8px 10px;text-align:center;min-width:56px}
.hero-countdown b{display:block;font-size:20px;line-height:1}
.hero-countdown small{font-size:9px;opacity:.7}
.hero-prob{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.15);margin:14px 0 8px}
.hero-prob i{display:block}
.hero-prob-labels{display:flex;justify-content:space-between;font-size:11px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.mrow-t{min-width:56px;text-align:center;font-size:11px;color:var(--mut)}
.mrow-t b{display:block;font-size:13px;color:var(--ink)}
.mrow-teams{flex:1;display:flex;flex-direction:column;gap:6px}
.mrow-team{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.mrow-sc{min-width:44px;text-align:center;font-size:15px;font-weight:800;direction:ltr;display:flex;flex-direction:column;gap:4px}
.mrow-sc .winner{color:var(--ok)}
.mrow-sc .loser{color:var(--mut)}
.standings{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stand-row{display:grid;grid-template-columns:30px 1fr 36px 30px 30px 30px 44px;gap:6px;padding:11px 12px;align-items:center;font-size:13px;border-bottom:1px solid var(--line)}
.stand-row.hd{background:var(--card2);font-size:11px;color:var(--mut);padding:8px 12px}
.stand-row.me{background:rgba(0,77,152,.15)}
.stand-team{display:flex;align-items:center;gap:8px;overflow:hidden}
.stand-team span{font-weight:600;white-space:nowrap}
.stand-pts{font-weight:800;text-align:center}
.stand-num{text-align:center;color:var(--mut)}
.stand-rk{font-weight:700;color:var(--mut);text-align:center}
.crest{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#2c3e50;color:#fff;font-weight:800;flex:none;border:2px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;width:100%;margin-bottom:8px}
.btn.ghost{background:var(--card2);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{padding:8px 16px;border-radius:20px;background:var(--card2);font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--mut)}
input{width:100%;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.squad-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.pcard .avatar{width:70px;height:70px;margin:0 auto 8px;border-radius:50%;background:linear-gradient(135deg,#004d98,#a50044);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}
.pcard .name{font-size:14px;font-weight:700}
.pcard .pos{font-size:11px;color:var(--mut)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{background:var(--bg2);width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow-y:auto}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bg2);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-around}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:10.5px;font-weight:600}
.nav-btn.on{color:var(--acc)}
.nav-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:200}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.tabs{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1 0 auto;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--ink)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="crest" style="width:38px;height:38px;border-radius:8px;background:linear-gradient(90deg,#004d98 50%,#a50044 50%);border-color:#f5c418;font-size:14px">FCB</div>
    <div class="brand-t"><b>Blaugrana</b><small>لوحة مشجع برشلونة</small></div>
    <button class="ib" id="themeBtn"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/><circle cx="12" cy="12" r="4"/></svg></button>
    <button class="ib" id="settingsBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.4 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.4-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></button>
  </div>
</header>

<main>
  <section class="sc on" id="home"></section>
  <section class="sc" id="matches"></section>
  <section class="sc" id="standings"></section>
  <section class="sc" id="squad"></section>
  <section class="sc" id="more"></section>
  <section class="sc" id="settings"></section>
</main>

<nav class="nav">
  <div class="nav-in" id="navIn"></div>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheetIn"></div></div>

<script>
(function(){
 use strict ;

const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const ls = { get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// Safe Crest Generator
function crest(team, size = 40) {
  if (team ===  برشلونة ) {
    return `<div class="crest" style="width:${size}px;height:${size}px;background:linear-gradient(90deg,#004d98 50%,#a50044 50%);border-color:#f5c418;font-size:${Math.round(size*0.4)}px">FCB</div>`;
  }
  const initial = team.charAt(0);
  return `<div class="crest" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.4)}px">${initial}</div>`;
}

// Dynamic Dates to ensure upcoming matches always exist
const now = Date.now();
const day = 86400000;
const STANDINGS = [
  [ برشلونة , 8, 0, 0, 24], [ أتلتيكو مدريد , 6, 1, 1, 19], [ ريال بيتيس , 6, 1, 1, 19], [ ريال مدريد , 6, 0, 2, 18], [ إشبيلية , 4, 2, 2, 14]
];
const MATCHES = [
  { id:  m1 , comp:  الدوري , home: false, opp:  إشبيلية , iso: new Date(now - 5*day).toISOString(), score: [3, 1] },
  { id:  m2 , comp:  الدوري , home: true, opp:  خيتافي , iso: new Date(now - 2*day).toISOString(), score: [3, 0] },
  { id:  m3 , comp:  دوري الأبطال , home: false, opp:  باريس سان جيرمان , iso: new Date(now + 1*day).toISOString(), probs: [39, 22, 39] },
  { id:  m4 , comp:  الدوري , home: true, opp:  ريال مدريد , iso: new Date(now + 4*day).toISOString() },
  { id:  m5 , comp:  الدوري , home: true, opp:  ألافيس , iso: new Date(now + 10*day).toISOString() }
];
const SQUAD = [
  [1,  جوان غارسيا ,  حارس ], [13,  شتشيسني ,  حارس ], [25,  ليفاكوفيتش ,  حارس ],
  [2,  كانسيلو ,  دفاع ], [3,  بالدي ,  دفاع ], [5,  كوباسي ,  دفاع ], [23,  كوندي ,  دفاع ],
  [8,  بيدري ,  وسط ], [16,  رودري ,  وسط ], [6,  غافي ,  وسط ], [21,  دي يونغ ,  وسط ],
  [10,  لامين يامال ,  هجوم ], [11,  رافينيا ,  هجوم ], [9,  جيسوس ,  هجوم ], [17,  غوردون ,  هجوم ]
];

const state = { theme: ls.get( theme ,  dark ) };
function applyTheme(t) { state.theme = t; ls.set( theme , t); document.documentElement.setAttribute( data-th , t); }

const ICONS = { home: <path d="M3 11l9-8 9 8M5 10v10h14V10"/> , ball: <circle cx="12" cy="12" r="9"/><path d="M12 8l3 2-1 4h-4l-1-4z"/> , chart: <path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/> , users: <circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 21a6 6 0 0112 0M17 19a5 5 0 014-4.9"/> , more: <circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/>  };
const ic = (name, size = 22) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] ||   }</svg>`;

function fmtDate(iso) { try { return new Date(iso).toLocaleString( ar-IQ , { day:  numeric , month:  short , hour:  2-digit , minute:  2-digit  }); } catch { return   ; } }
function nextMatch() { return MATCHES.filter(m => !m.score && new Date(m.iso).getTime() > Date.now()).sort((a, b) => new Date(a.iso) - new Date(b.iso))[0]; }
function recentMatches() { return MATCHES.filter(m => m.score).sort((a, b) => new Date(b.iso) - new Date(a.iso)); }
function toast(msg) { const t = el( div ,  toast , msg); document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }

function initNav() {
  const items = [{ id:  home , label:  الرئيسية , icon:  home  }, { id:  matches , label:  المباريات , icon:  ball  }, { id:  standings , label:  الترتيب , icon:  chart  }, { id:  squad , label:  الفريق , icon:  users  }, { id:  more , label:  المزيد , icon:  more  }];
  const n = $( navIn );
  items.forEach(item => {
    const b = el( button ,  nav-btn );
    b.innerHTML = ic(item.icon, 22) + `<span>${item.label}</span>`;
    b.onclick = () => go(item.id);
    b.dataset.id = item.id;
    n.appendChild(b);
  });
}

function go(id) {
  document.querySelectorAll( .sc ).forEach(s => s.classList.toggle( on , s.id === id));
  document.querySelectorAll( .nav-btn ).forEach(b => b.classList.toggle( on , b.dataset.id === id || (id ===  settings  && b.dataset.id ===  more )));
  if (id ===  home ) renderHome();
  if (id ===  matches ) renderMatches();
  if (id ===  standings ) renderStandings();
  if (id ===  squad ) renderSquad();
  if (id ===  more ) renderMore();
  if (id ===  settings ) renderSettings();
  window.scrollTo(0, 0);
}

function renderHome() {
  const root = $( home ); root.innerHTML =   ;
  const nx = nextMatch();
  if (nx) {
    const probs = nx.probs || [60, 20, 20];
    const hero = el( div ,  hero );
    hero.innerHTML = `
      <span class="hero-tag">${nx.comp} · المباراة القادمة</span>
      <div class="hero-teams">
        <div class="hero-team">${crest(nx.home ?  برشلونة  : nx.opp, 60)}<b>${nx.home ?  برشلونة  : nx.opp}</b></div>
        <div class="hero-vs">VS</div>
        <div class="hero-team">${crest(nx.home ? nx.opp :  برشلونة , 60)}<b>${nx.home ? nx.opp :  برشلونة }</b></div>
      </div>
      <div style="text-align:center;font-size:14px;margin-top:10px">${fmtDate(nx.iso)}</div>
      <div class="hero-prob">
        <i style="width:${probs[0]}%;background:#fff"></i><i style="width:${probs[1]}%;background:rgba(255,255,255,.5)"></i><i style="width:${probs[2]}%;background:#ff6b8a"></i>
      </div>
      <div class="hero-prob-labels"><span>فوز ${probs[0]}%</span><span>تعادل ${probs[1]}%</span><span>خسارة ${probs[2]}%</span></div>`;
    hero.onclick = () => toast( تفاصيل المباراة قريباً );
    root.appendChild(hero);
  }
  const rCard = el( div ,  card );
  rCard.innerHTML = `<h2>آخر النتائج</h2>`;
  const rl = el( div ,  mlist );
  recentMatches().forEach(m => {
    const bs = m.home ? m.score[0] : m.score[1], os = m.home ? m.score[1] : m.score[0];
    const barca = m.home ?  برشلونة  : m.opp, opp = m.home ? m.opp :  برشلونة ;
    rl.innerHTML += `<div class="mrow"><div class="mrow-teams"><div class="mrow-team">${crest(barca, 20)} ${barca}</div><div class="mrow-team">${crest(opp, 20)} ${opp}</div></div><div class="mrow-sc"><span class="${bs>os? winner : loser }">${bs}</span><span class="${os>bs? winner : loser }">${os}</span></div></div>`;
  });
  rCard.appendChild(rl); root.appendChild(rCard);
}

function renderMatches() {
  const root = $( matches ); root.innerHTML =  <h1>المباريات</h1> ;
  const c = el( div ,  card ); c.innerHTML =  <h2>القادمة</h2> ;
  MATCHES.filter(m => !m.score).forEach(m => {
    c.innerHTML += `<div class="row"><span>${m.home ?  برشلونة  : m.opp} ضد ${m.home ? m.opp :  برشلونة }</span><span class="mut">${fmtDate(m.iso)}</span></div>`;
  });
  root.appendChild(c);
}

function renderStandings() {
  const root = $( standings ); root.innerHTML =  <h1>الترتيب</h1> ;
  const wrap = el( div ,  standings );
  wrap.innerHTML =  <div class="stand-row hd"><span>#</span><span>الفريق</span><span>لعب</span><span>ف</span><span>ت</span><span>خ</span><span>نقاط</span></div> ;
  STANDINGS.forEach((r, i) => {
    wrap.innerHTML += `<div class="stand-row ${r[0]=== برشلونة ? me :  }"><span class="stand-rk">${i+1}</span><div class="stand-team">${crest(r[0], 20)}<span>${r[0]}</span></div><span class="stand-num">${r[1]+r[2]+r[3]}</span><span class="stand-num">${r[1]}</span><span class="stand-num">${r[2]}</span><span class="stand-num">${r[3]}</span><span class="stand-pts">${r[4]}</span></div>`;
  });
  root.appendChild(wrap);
}

function renderSquad() {
  const root = $( squad ); root.innerHTML =  <h1>الفريق</h1> ;
  const grid = el( div ,  squad-grid );
  SQUAD.forEach(p => {
    grid.innerHTML += `<div class="pcard"><div class="avatar">${p[0]}</div><div class="name">${p[1]}</div><div class="pos">${p[2]}</div></div>`;
  });
  root.appendChild(grid);
}

function renderMore() {
  const root = $( more ); root.innerHTML =  <h1>المزيد</h1> ;
  const c = el( div ,  card pad0 );
  c.innerHTML = `<div class="row" style="padding:16px" onclick="window.__goSet()">الإعدادات <span>‹</span></div>`;
  window.__goSet = () => go( settings );
  root.appendChild(c);
}

function renderSettings() {
  const root = $( settings ); root.innerHTML =  <h1>الإعدادات</h1> ;
  const c = el( div ,  card );
  c.innerHTML = `<h2>المظهر</h2><button class="btn" onclick="window.__toggleTheme()">تغيير الوضع (ليلي/نهاري)</button>`;
  window.__toggleTheme = () => { applyTheme(state.theme ===  dark  ?  light  :  dark ); toast( تم تغيير المظهر ); };
  root.appendChild(c);
}

// Boot safely
try {
  applyTheme(state.theme);
  initNav();
  go( home );
  $( themeBtn ).onclick = () => { applyTheme(state.theme ===  dark  ?  light  :  dark ); };
  $( settingsBtn ).onclick = () => go( settings );
} catch(e) {
  document.querySelector( main ).innerHTML = `<div style="padding:20px;color:#ef4444">حدث خطأ: ${e.message}</div>`;
}

})();
</script>
</body>
</html>
