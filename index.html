<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>CulerZone — Blaugrana</title>
<style>
:root{--bg:#070b14;--panel:#0f1626;--card:#131b2e;--line:#1e2942;--muted:#8894b8;--cyan:#00d4ff;--blue:#004d98;--maroon:#a50044;--gold:#f5c418}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#fff;margin:0;padding:0 0 calc(82px + env(safe-area-inset-bottom));min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:var(--panel);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--maroon));border:1px solid var(--gold);display:grid;place-items:center;font-size:12px;font-weight:900}
.title{font-size:20px;font-weight:800;color:var(--cyan)}
.icon-btn{background:none;border:0;color:white;font-size:22px;padding:6px;cursor:pointer}
#content{padding:12px;max-width:760px;margin:auto;min-height:55vh}
.section-title{margin:18px 8px 10px;font-size:18px}
.card{background:var(--card);padding:15px;margin:10px 0;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.hero{background:radial-gradient(circle at top left,#183c7a 0,#0f234c 40%,#35102e 100%);text-align:center;padding:22px 14px}
.mut{color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.crest{display:inline-flex;justify-content:center;align-items:center;min-width:36px;height:36px;padding:0 5px;border-radius:50%;background:linear-gradient(90deg,var(--blue) 50%,var(--maroon) 50%);border:2px solid var(--gold);color:white;font-size:10px;font-weight:900;margin-left:8px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(15,22,38,.98);padding:8px 2px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:10}
.nav button{flex:1;min-width:0;background:none;border:0;color:var(--muted);font-size:11px;font-weight:700;padding:6px 1px;cursor:pointer}
.nav button .emoji{display:block;font-size:20px;margin-bottom:4px}
.nav button.active{color:var(--cyan)}
.nav button:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pill{display:inline-block;border:1px solid #365078;border-radius:99px;padding:5px 10px;color:#c5d7ff;font-size:12px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat strong{display:block;color:var(--cyan);font-size:18px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.small-btn{border:1px solid #365078;border-radius:9px;background:#101d33;color:white;padding:9px 12px;cursor:pointer}
footer{text-align:center;color:#64718f;font-size:11px;padding:12px}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><div class="logo" aria-hidden="true">FCB</div><div class="title">CulerZone</div></div>
  <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات" type="button">⚙️</button>
</header>

<main id="content" aria-live="polite"></main>

<nav class="nav" id="nav" aria-label="التنقل الرئيسي">
  <button type="button" data-page="home" class="active"><span class="emoji">🏠</span>الرئيسية</button>
  <button type="button" data-page="matches"><span class="emoji">⚽</span>المباريات</button>
  <button type="button" data-page="standings"><span class="emoji">📊</span>الترتيب</button>
  <button type="button" data-page="squad"><span class="emoji">👥</span>الفريق</button>
  <button type="button" data-page="more"><span class="emoji">☰</span>المزيد</button>
</nav>

<script>
"use strict";

// بيانات تجريبية للواجهة فقط؛ ليست نتائج مباشرة أو جدولاً رسمياً محدثاً.
const MATCHES = [
  {comp:"الدوري الإسباني",home:false,opp:"إشبيلية",score:[3,1],date:"نتيجة تجريبية"},
  {comp:"الدوري الإسباني",home:true,opp:"خيتافي",score:[3,0],date:"نتيجة تجريبية"},
  {comp:"دوري أبطال أوروبا",home:false,opp:"باريس سان جيرمان",date:"موعد غير مؤكد",probs:[39,22,39]},
  {comp:"الدوري الإسباني",home:true,opp:"ريال مدريد",date:"موعد غير مؤكد"}
];

const STANDINGS = [
  ["برشلونة",8,0,0,24],
  ["أتلتيكو مدريد",6,1,1,19],
  ["ريال بيتيس",6,1,1,19],
  ["ريال مدريد",6,0,2,18],
  ["إشبيلية",4,2,2,14]
];

const SQUAD = [
  [1,"جوان غارسيا","حارس مرمى"],
  [2,"كانسيلو","مدافع"],
  [3,"بالدي","مدافع"],
  [8,"بيدري","وسط"],
  [16,"رودري","وسط"],
  [10,"لامين يامال","مهاجم"],
  [9,"غابرييل جيسوس","مهاجم"]
];

const content = document.getElementById("content");
const navButtons = Array.from(document.querySelectorAll("#nav button"));

function esc(value) {
  return String(value).replace(/[&<>" ]/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;", " :"&quot;"," ":"&#39;"
  })[ch]);
}

function teamName(match, isHome) {
  return isHome ? (match.home ? "برشلونة" : match.opp) : (match.home ? match.opp : "برشلونة");
}

function renderHome() {
  const next = MATCHES[2];
  let html = `
    <h2 class="section-title">أهلاً بك في CulerZone 🔵🔴</h2>
    <section class="card hero">
      <span class="pill">${esc(next.comp)}</span>
      <h2>المباراة القادمة</h2>
      <div style="display:flex;justify-content:center;align-items:center;gap:12px;margin:18px 0">
        <div><div class="crest">FCB</div><div>برشلونة</div></div>
        <strong style="font-size:18px">VS</strong>
        <div><div class="crest" style="background:#26334b">${esc(next.opp.slice(0,3))}</div><div>${esc(next.opp)}</div></div>
      </div>
      <p>${esc(next.date)}</p>
      <p class="mut">بيانات تجريبية — تحقق من المواعيد الرسمية قبل المباراة</p>
    </section>
    <div class="stat-grid">
      <div class="stat"><strong>1899</strong><span class="mut">سنة التأسيس</span></div>
      <div class="stat"><strong>FCB</strong><span class="mut">فخر كتالونيا</span></div>
      <div class="stat"><strong>🔵🔴</strong><span class="mut">ألواننا</span></div>
    </div>
    <h2 class="section-title">آخر النتائج (بيانات تجريبية)</h2>`;
  MATCHES.slice(0,2).forEach(m => {
    const home = m.home ? "برشلونة" : m.opp;
    const away = m.home ? m.opp : "برشلونة";
    const score = m.home ? `${m.score[0]} - ${m.score[1]}` : `${m.score[1]} - ${m.score[0]}`;
    html += `<article class="card row"><div><b>${esc(home)} × ${esc(away)}</b><div class="mut">${esc(m.comp)}</div></div><strong>${score}</strong></article>`;
  });
  return html;
}

function renderMatches() {
  let html = `<h2 class="section-title">المباريات</h2><p class="mut" style="margin:0 10px">المواعيد والنتائج أدناه أمثلة توضيحية وليست بيانات مباشرة.</p>`;
  MATCHES.forEach(m => {
    const home = m.home ? "برشلونة" : m.opp;
    const away = m.home ? m.opp : "برشلونة";
    const result = m.score ? `<strong>${m.home ? m.score[0] + " - " + m.score[1] : m.score[1] + " - " + m.score[0]}</strong>` : `<span class="pill">${esc(m.date)}</span>`;
    html += `<article class="card"><div class="mut">${esc(m.comp)}</div><div class="row"><b>${esc(home)} × ${esc(away)}</b>${result}</div><div class="mut">${esc(m.date)}</div></article>`;
  });
  return html;
}

function renderStandings() {
  let html = `<h2 class="section-title">ترتيب الليغا</h2><p class="mut" style="margin:0 10px">جدول توضيحي تجريبي، وليس ترتيباً مباشراً.</p><section class="card">`;
  STANDINGS.forEach((t,i) => {
    html += `<div class="row" style="${t[0] === "برشلونة" ? "background:#1e2942;border-radius:8px;padding-right:8px;padding-left:8px;" : ""}"><span><b>${i+1}. ${esc(t[0])}</b><div class="mut">لعب ${t[1]+t[2]+t[3]} · فوز ${t[1]} · تعادل ${t[2]} · خسارة ${t[3]}</div></span><strong>${t[4]} نقطة</strong></div>`;
  });
  html += `</section>`;
  return html;
}

function renderSquad() {
  let html = `<h2 class="section-title">الفريق</h2><p class="mut" style="margin:0 10px">قائمة توضيحية؛ قد لا تعكس التشكيلة الحالية.</p>`;
  SQUAD.forEach(p => {
    html += `<article class="card row"><span><span class="crest">${p[0]}</span><b>${esc(p[1])}</b></span><span class="mut">${esc(p[2])}</span></article>`;
  });
  return html;
}

function renderMore() {
  return `<h2 class="section-title">المزيد</h2>
    <section class="card"><h3>عن CulerZone</h3><p>مساحة جماهيرية لعشاق برشلونة، تجمع الأخبار والمباريات والنتائج ومعلومات الفريق في واجهة واحدة.</p><p class="mut">هذه نسخة أولية ببيانات تجريبية، ولا تتصل حالياً بمصدر أخبار أو نتائج مباشرة.</p></section>
    <section class="card"><h3>الميزات القادمة</h3><p>📰 أخبار النادي</p><p>📅 جدول مباريات محدث</p><p>📈 إحصائيات وترتيب موثوق</p><p>🔔 تنبيهات المباريات</p></section>`;
}

function showPage(page) {
  const pages = {
    home: renderHome,
    matches: renderMatches,
    standings: renderStandings,
    squad: renderSquad,
    more: renderMore
  };
  if (!pages[page]) page = "home";
  try {
    content.innerHTML = pages[page]();
  } catch (error) {
    console.error("CulerZone render error:", error);
    content.innerHTML = `<section class="card"><h2>تعذر عرض الصفحة</h2><p>حدث خطأ أثناء عرض المحتوى. أغلق التطبيق وافتحه مجدداً.</p></section>`;
  }
  navButtons.forEach(button => {
    const active = button.dataset.page === page;
    button.classList.toggle("active", active);
    button.setAttribute("aria-current", active ? "page" : "false");
  });
  window.scrollTo(0,0);
}

navButtons.forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

document.getElementById("settingsBtn").addEventListener("click", () => {
  alert("الإعدادات ستتوفر في تحديث لاحق.");
});

window.addEventListener("error", event => {
  console.error("CulerZone JavaScript error:", event.message);
});

showPage("home");
</script>
</body>
</html>
